<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Parkir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="judul">Sistem Informasi Parkir</h1>
        <h2 id="statusParkir">Slot Tersedia: 20</h2>

        <div class="forml">
            <input type="text" id="platNomor" placeholder="Masukkan Plat Nomor">
            <button id="butonmasuk" onclick="kendaraanMasuk()">Masuk</button>
        </div>

        <h3 id="daftar">Daftar Kendaraan Parkir</h3>
        <div class="parkir-container" id="parkirArea"></div>

        <h3 >Total Pendapatan: Rp <span id="pendapatan">0</span></h3>
        <button class="withdraw-btn" onclick="tarikDana()">Tarik Dana</button>
		<button id="logoutbtn" type="button" onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
    
    <div class="modal fade" data-bs-backdrop="static" data-bs-theme="dark" id="modalAwal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Selamat Datang</h1>
            </div>
            <div class="modal-body">
                <h3>Password</h3>
                <input id="passdata" type="password">
                <h5 id="textpwsalah" class="text-danger">password salah</h5>
            </div>
            <div class="modal-footer">
                <button onclick="sendPassAwal()" type="button" class="btn btn-primary">Lanjutkan</button>
            </div>
          </div>
        </div>
      </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
