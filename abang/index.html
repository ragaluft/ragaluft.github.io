<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Brother!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Menambahkan jQuery -->
</head>
<body>
    <audio id="audio">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1 id="judul">Happy Birthday abang !</h1>
        <div class="gambar">
            <img src="WhatsApp Image 2024-10-30 at 19.14.57.jpeg" alt="">
        </div>
        <div class="pesan">
            <p id="pesan">HBD bang.</p>
        </div>
        <div class="love">
            <button onclick="suara()" id="love-btn">Klik untuk keren!</button>
            <div id="love-count">0</div>
            <div id="flowers"></div>
        </div>
    </div>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .cake-container {
            position: relative;
            width: 200px;
            height: 300px;
        }
        .balloon {
            position: absolute;
            bottom: 66%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border: 2px solid black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 19px;
            background-color: white;
        }
        .string {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 100px;
            background-color: black;
        }
        .cake {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 100px;
            background-color: #ffcc99;
            border: 2px solid black;
        }
        .cake-layer1 {
            position: absolute;
            bottom: 0;
            width: 150px;
            height: 30px;
            background-color: #cc99ff;
            border-top: 2px solid black;
        }
        .cake-layer2 {
            position: absolute;
            bottom: 30px;
            width: 150px;
            height: 30px;
            background-color: #99cc00;
            border-top: 2px solid black;
        }
        .cake-layer3 {
            position: absolute;
            bottom: 60px;
            width: 150px;
            height: 40px;
            background-color: #ffcc99;
            border-top: 2px solid black;
        }
        .candle {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 30px;
            background-color: yellow;
            border: 2px solid black;
        }
        .flame {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 10px;
            background-color: black;
        }
        .decoration {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .decoration1 { background-color: red; top: 10px; left: 10px; }
        .decoration2 { background-color: blue; top: 10px; right: 10px; }
        .decoration3 { background-color: yellow; top: 30px; left: 30px; }
        .decoration4 { background-color : green; top: 30px; right: 30px; }
        .decoration5 { background-color: purple; top: 50px; left: 50px; }
        .decoration6 { background-color: orange; top: 50px; right: 50px; }
    </style>

    <div class="cake-container">
        <div class="balloon"></div>
        <div class="string"></div>
        <div class="cake">
            <div class="cake-layer1"></div>
            <div class="cake-layer2"></div>
            <div class="cake-layer3"></div>
            <div class="candle">
                <div class="flame"></div>
            </div>
            <div class="decoration decoration1"></div>
            <div class="decoration decoration2"></div>
            <div class="decoration decoration3"></div>
            <div class="decoration decoration4"></div>
            <div class="decoration decoration5"></div>
            <div class="decoration decoration6"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
